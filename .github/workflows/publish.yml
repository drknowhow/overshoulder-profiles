name: publish

# On every merge: sign each profile and the catalog with the registry key, check every signature with the
# key Overshoulder ships, build overshoulder.yepgent.com from the result and deploy it to Netlify. The
# signing key and the Netlify token are secrets of the "signing" environment, which only main can use.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  OVERSHOULDER: git+https://github.com/drknowhow/overshoulder@8824a2a27365a8ee08713ded86d8f6db5da24317

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "overshoulder @ $OVERSHOULDER"
      - name: Sign the profiles and the catalog
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m overshoulder.registry build --root . --out dist
      - name: Check every signature with the key Overshoulder ships
        shell: python
        run: |
          from pathlib import Path
          from overshoulder import registry, share, sign
          d = Path("dist")
          index = registry.read_index((d / "index.json").read_bytes(), (d / "index.json.sig").read_text())
          for p in index["profiles"]:
              signed = sign.verify(share.read((d / p["path"]).read_bytes()))
              print(f"{p['path']}: {signed.words()}")
          print(f"catalog: {len(index['profiles'])} profiles, signature checks out")
      - name: Build the site
        run: python site/build.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: dist
      - name: Deploy to overshoulder.yepgent.com
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python site/deploy.py --dir dist
